name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\boogie.exe dist\boogie.exe

          $zipStage = "dist\zip_stage"
          New-Item -ItemType Directory -Force "$zipStage\config" | Out-Null
          Copy-Item target\release\boogie.exe "$zipStage\boogie.exe"
          Copy-Item config\api_keys.example.json "$zipStage\config\api_keys.example.json"
          Copy-Item README.md "$zipStage\README.md"
          Copy-Item LICENSE "$zipStage\LICENSE"
          Compress-Archive -Path "$zipStage\*" -DestinationPath dist\Boogie-Windows-x64.zip -Force
          Remove-Item -Recurse -Force $zipStage

          Get-FileHash dist\boogie.exe, dist\Boogie-Windows-x64.zip -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/boogie.exe
            dist/Boogie-Windows-x64.zip
            dist/SHA256SUMS.txt
