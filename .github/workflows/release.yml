name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package versioned release artifacts
        shell: pwsh
        run: |
          $cargoToml = Get-Content -Raw -Path Cargo.toml
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not parse version from Cargo.toml"
          }
          $ver = $Matches[1]
          $exeName = "Boogie-v$ver.exe"
          $zipName = "Boogie-v$ver-Windows-x64.zip"

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\boogie.exe "dist\$exeName" -Force

          $zipStage = "dist\zip_stage"
          if (Test-Path $zipStage) { Remove-Item -Recurse -Force $zipStage }
          New-Item -ItemType Directory -Force "$zipStage\config" | Out-Null
          Copy-Item "dist\$exeName" "$zipStage\$exeName" -Force
          Copy-Item config\api_keys.example.json "$zipStage\config\api_keys.example.json" -Force
          Copy-Item README.md "$zipStage\README.md" -Force
          Copy-Item LICENSE "$zipStage\LICENSE" -Force
          Compress-Archive -Path "$zipStage\*" -DestinationPath "dist\$zipName" -Force
          Remove-Item -Recurse -Force $zipStage

          Get-FileHash "dist\$exeName", "dist\$zipName" -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Boogie-v*.exe
            dist/Boogie-v*-Windows-x64.zip
            dist/SHA256SUMS.txt
