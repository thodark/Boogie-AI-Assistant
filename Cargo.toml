[package]
name = "boogie"
version = "0.4.5"
edition = "2024"
description = "Boogie — ultra-fast native Rust real-time voice AI assistant for Windows powered by Gemini Live API"
license = "MIT"
repository = "https://github.com/thodark/Boogie-AI-Assistant"
homepage = "https://github.com/thodark/Boogie-AI-Assistant"
keywords = ["ai", "voice-assistant", "gemini", "windows", "egui"]
categories = ["gui", "multimedia::audio", "os::windows-apis"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# GUI
eframe = "0.31"
egui = "0.31"

# Audio I/O
cpal = "0.15"

# WebSocket (Gemini Live API)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# Web framework (dashboard)
axum = { version = "0.8", features = ["ws"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (dashboard auth)
ring = "0.17"

# Browser automation
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }

# Windows APIs
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

# Screen capture
screenshots = "0.8"

# System info
sysinfo = "0.33"

# Image processing
image = "0.25"

# DSP
rustfft = "6"

# Misc
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
open = "5"
urlencoding = "2"

# File processing & Document Studio (PDF / Word / Excel + native Save As picker)
pdf-extract = "0.7"
calamine = "0.38"
docx-rs = "0.4"
rust_xlsxwriter = "0.80"
rfd = "0.15"

# Web scraping
scraper = "0.22"

# QR code
qrcode = "0.14"

# Clipboard
arboard = "3"

# Send to trash
trash = "5"

[[bin]]
name = "boogie"
path = "src/main.rs"
