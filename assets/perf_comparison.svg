<svg xmlns="http://www.w3.org/2000/svg" width="860" height="446" viewBox="0 0 860 446" role="img" aria-label="Visual Performance Comparison: Cold Startup Speed, Memory Consumption, and Footprint on Disk">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="slateDarkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0.5" y="0.5" width="859" height="445" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1" />

    <!-- Panel 1: Cold Startup Speed -->
    <g transform="translate(24, 20)">
      <path d="M8.5 1L2.5 8.5H7.2L6.2 13L11.5 5.5H6.8L8.5 1Z" fill="#22D3EE" />
    </g>
    <text x="44" y="33" fill="#F8FAFC" font-size="13.5" font-weight="700">Cold Startup Speed<tspan dx="8" fill="#64748B" font-size="12" font-weight="400">Launch to Window Ready · shorter is better</tspan></text>

    <text x="24" y="68" fill="#F8FAFC" font-size="12.5" font-weight="600">Boogie (Rust Native)</text>
    <rect x="212" y="56" width="290" height="16" rx="8" fill="#1E293B" />
    <rect x="212" y="56" width="16" height="16" rx="8" fill="url(#cyanGrad)" />
    <text x="518" y="68" font-size="12.5"><tspan fill="#22D3EE" font-weight="700">0.14s</tspan><tspan dx="7" fill="#94A3B8" font-size="11.5">(137 ms window · 0.74s full GPU+API)</tspan></text>

    <text x="24" y="96" fill="#CBD5E1" font-size="12.5">Python + PyQt6</text>
    <rect x="212" y="84" width="290" height="16" rx="8" fill="#1E293B" />
    <rect x="212" y="84" width="160" height="16" rx="8" fill="url(#slateGrad)" />
    <text x="518" y="96" fill="#CBD5E1" font-size="12.5">2.5 – 4.5s</text>

    <text x="24" y="124" fill="#CBD5E1" font-size="12.5">Electron / Chromium App</text>
    <rect x="212" y="112" width="290" height="16" rx="8" fill="#1E293B" />
    <rect x="212" y="112" width="290" height="16" rx="8" fill="url(#slateDarkGrad)" />
    <text x="518" y="124" fill="#CBD5E1" font-size="12.5">3.5 – 7.0s</text>

    <line x1="24" y1="149" x2="836" y2="149" stroke="#1E293B" stroke-width="1" />

    <!-- Panel 2: Memory Consumption -->
    <g transform="translate(24, 168)" fill="none" stroke="#A78BFA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="3.5" width="7" height="7" rx="1.2" />
      <rect x="5.5" y="5.5" width="3" height="3" fill="#A78BFA" stroke="none" />
      <path d="M5.5 1.5V3.5M8.5 1.5V3.5M5.5 10.5V12.5M8.5 10.5V12.5M1.5 5.5H3.5M1.5 8.5H3.5M10.5 5.5H12.5M10.5 8.5H12.5" />
    </g>
    <text x="44" y="181" fill="#F8FAFC" font-size="13.5" font-weight="700">Memory Consumption<tspan dx="8" fill="#64748B" font-size="12" font-weight="400">Active Voice Session · shorter is better</tspan></text>

    <text x="24" y="216" fill="#F8FAFC" font-size="12.5" font-weight="600">Boogie (Rust Private RAM)</text>
    <rect x="212" y="204" width="290" height="16" rx="8" fill="#1E293B" />
    <rect x="212" y="204" width="18" height="16" rx="8" fill="url(#violetGrad)" />
    <text x="518" y="216" font-size="12.5"><tspan fill="#A78BFA" font-weight="700">33.3 MB</tspan><tspan dx="7" fill="#94A3B8" font-size="11.5">(~60.8 MB working set w/ GPU + DLLs)</tspan></text>

    <text x="24" y="244" fill="#CBD5E1" font-size="12.5">Python + PyQt6</text>
    <rect x="212" y="232" width="290" height="16" rx="8" fill="#1E293B" />
    <rect x="212" y="232" width="154" height="16" rx="8" fill="url(#slateGrad)" />
    <text x="518" y="244" fill="#CBD5E1" font-size="12.5">240 – 380 MB</text>

    <text x="24" y="272" fill="#CBD5E1" font-size="12.5">Electron / Chromium App</text>
    <rect x="212" y="260" width="290" height="16" rx="8" fill="#1E293B" />
    <rect x="212" y="260" width="290" height="16" rx="8" fill="url(#slateDarkGrad)" />
    <text x="518" y="272" fill="#CBD5E1" font-size="12.5">450 – 800+ MB</text>

    <line x1="24" y1="297" x2="836" y2="297" stroke="#1E293B" stroke-width="1" />

    <!-- Panel 3: Footprint on Disk -->
    <g transform="translate(24, 316)" fill="none" stroke="#34D399" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 1.5L12 4.2V9.8L7 12.5L2 9.8V4.2L7 1.5Z" />
      <path d="M2 4.2L7 7L12 4.2" />
      <path d="M7 7V12.5" />
    </g>
    <text x="44" y="329" fill="#F8FAFC" font-size="13.5" font-weight="700">Footprint on Disk<tspan dx="8" fill="#64748B" font-size="12" font-weight="400">Ready to Run · shorter is better</tspan></text>

    <text x="24" y="364" fill="#F8FAFC" font-size="12.5" font-weight="600">Boogie (Single .exe)</text>
    <rect x="212" y="352" width="290" height="16" rx="8" fill="#1E293B" />
    <rect x="212" y="352" width="18" height="16" rx="8" fill="url(#emeraldGrad)" />
    <text x="518" y="364" font-size="12.5"><tspan fill="#34D399" font-weight="700">28.0 MB</tspan><tspan dx="7" fill="#94A3B8" font-size="11.5">(zero external runtime)</tspan></text>

    <text x="24" y="392" fill="#CBD5E1" font-size="12.5">Python + Embedded Env</text>
    <rect x="212" y="380" width="290" height="16" rx="8" fill="#1E293B" />
    <rect x="212" y="380" width="180" height="16" rx="8" fill="url(#slateGrad)" />
    <text x="518" y="392" font-size="12.5"><tspan fill="#CBD5E1">350+ MB</tspan><tspan dx="7" fill="#94A3B8" font-size="11.5">(Python + Qt + wheels)</tspan></text>

    <text x="24" y="420" fill="#CBD5E1" font-size="12.5">Electron Bundle</text>
    <rect x="212" y="408" width="290" height="16" rx="8" fill="#1E293B" />
    <rect x="212" y="408" width="290" height="16" rx="8" fill="url(#slateDarkGrad)" />
    <text x="518" y="420" fill="#CBD5E1" font-size="12.5">250 – 600 MB</text>
  </g>
</svg>
