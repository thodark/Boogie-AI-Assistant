<svg xmlns="http://www.w3.org/2000/svg" width="860" height="186" viewBox="0 0 860 186" role="img" aria-label="Visual Response Latency Comparison: Time to First Spoken Word">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="slateDarkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="0.5" y="0.5" width="859" height="185" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1" />

    <g transform="translate(24, 20)" fill="none" stroke="#F59E0B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="1.5" width="4" height="6.5" rx="2" />
      <path d="M3 6.5C3 8.7 4.8 10.5 7 10.5C9.2 10.5 11 8.7 11 6.5" />
      <path d="M7 10.5V12.5M5 12.5H9" />
    </g>
    <text x="44" y="33" fill="#F8FAFC" font-size="13.5" font-weight="700">Time to First Spoken Word After Asking<tspan dx="8" fill="#64748B" font-size="12" font-weight="400">shorter is better</tspan></text>

    <text x="24" y="68" fill="#F8FAFC" font-size="12.5" font-weight="600">Boogie API First Audio (TTFB)</text>
    <rect x="246" y="56" width="268" height="16" rx="8" fill="#1E293B" />
    <rect x="246" y="56" width="30" height="16" rx="8" fill="url(#cyanGrad)" />
    <text x="530" y="68" font-size="12.5"><tspan fill="#22D3EE" font-weight="700">0.58s</tspan><tspan dx="7" fill="#94A3B8" font-size="11.5">(541 – 626 ms measured)</tspan></text>

    <text x="24" y="98" fill="#E2E8F0" font-size="12.5" font-weight="600">Boogie Total Voice-to-Voice*</text>
    <rect x="246" y="86" width="268" height="16" rx="8" fill="#1E293B" />
    <rect x="246" y="86" width="64" height="16" rx="8" fill="url(#violetGrad)" />
    <text x="530" y="98" font-size="12.5"><tspan fill="#A78BFA" font-weight="700">1.0 – 1.3s</tspan><tspan dx="7" fill="#94A3B8" font-size="11.5">(incl. 450–750 ms VAD)</tspan></text>

    <text x="24" y="128" fill="#CBD5E1" font-size="12.5">Cascaded STT → LLM → Cloud TTS</text>
    <rect x="246" y="116" width="268" height="16" rx="8" fill="#1E293B" />
    <rect x="246" y="116" width="188" height="16" rx="8" fill="url(#slateGrad)" />
    <text x="530" y="128" font-size="12.5"><tspan fill="#CBD5E1">2.5 – 4.2s</tspan><tspan dx="7" fill="#94A3B8" font-size="11.5">(3 serial round-trips)</tspan></text>

    <text x="24" y="158" fill="#CBD5E1" font-size="12.5">Local Whisper + LLM + TTS</text>
    <rect x="246" y="146" width="268" height="16" rx="8" fill="#1E293B" />
    <rect x="246" y="146" width="268" height="16" rx="8" fill="url(#slateDarkGrad)" />
    <text x="530" y="158" font-size="12.5"><tspan fill="#CBD5E1">3.5 – 6.0s+</tspan><tspan dx="7" fill="#94A3B8" font-size="11.5">(batch decode + synth)</tspan></text>
  </g>
</svg>
